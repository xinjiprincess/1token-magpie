name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GTK and WebKitGTK
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Gofmt
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

      - name: Vet
        run: go vet -tags gtk3 ./...

      # Upstream's update and branding tests assert the original Magpie
      # update feed and `magpie` names. This fork disables that feed and
      # renames the app, so those packages are covered by the build workflows
      # instead of this smoke suite.
      - name: Build without GUI
        run: go build -tags nogui ./...

      - name: Test fork-compatible packages
        timeout-minutes: 15
        run: |
          go test -timeout 12m -tags nogui \
            ./internal/appdir \
            ./internal/settings \
            ./internal/shortcut \
            ./internal/autostart \
            ./internal/catalog \
            ./internal/usage \
            ./internal/usageapi \
            ./internal/redact \
            ./internal/sessions